[toolchain]
anchor_version = "1.2.0"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.devnet]
proofsec = "HCYkSp64qdMRjiCbauEzPhx9VtNGB6fp5NvKdCRb8tjj"

[programs.localnet]
proofsec = "HCYkSp64qdMRjiCbauEzPhx9VtNGB6fp5NvKdCRb8tjj"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 'tests/**/*.ts'"

[hooks]
post_build = "node scripts/sync-idl.mjs"

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = true
