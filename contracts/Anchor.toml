[toolchain]
anchor_version = "1.2.0"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
proofsec = "PrfSec1111111111111111111111111111111111111"

[programs.devnet]
proofsec = "PrfSec1111111111111111111111111111111111111"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[test]
# initialize_config exige a upgrade authority (PS-03): o programa precisa ser
# implantado como upgradeable também nos testes (validator legado).
upgradeable = true

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 'tests/**/*.ts'"

[hooks]
# Depois de cada build, copia o IDL gerado de verdade para o frontend e o agente.
post_build = "node scripts/sync-idl.mjs"
