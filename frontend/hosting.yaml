AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ProofSec - hospedagem do frontend estatico (Next export) em S3 privado + CloudFront (OAC).
  Replica os headers de seguranca de frontend/next.config.mjs (PS-12). Sem custodia, sem segredos.
  Fluxo: criar a stack -> NEXT_STATIC_EXPORT=1 npm run build -> aws s3 sync out/ s3://<Bucket>
  -> invalidar o CloudFront. Depois, adicionar o dominio da distribuicao em SiwsDomains e
  AllowedOrigin da stack do backend (proofsec-<Stage>).

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  ApiHost:
    Type: String
    Default: ""
    AllowedPattern: '^([a-z0-9.-]+)?$'
    Description: Host do API Gateway (sem https://), saida ApiEndpoint do backend. Vazio = modo so on-chain.
  RpcHost:
    Type: String
    Default: api.devnet.solana.com
    AllowedPattern: '^[a-z0-9.-]+$'
    Description: Host do RPC Solana (http e wss) liberado no connect-src.
  ReportsBucket:
    Type: String
    Default: ""
    AllowedPattern: '^([a-z0-9.-]+)?$'
    Description: >-
      Bucket de relatorios (saida ReportsBucketName do backend). Libera so o host dele no connect-src
      (PS-47). Vazio = sem upload de relatorios pelo site.
  EnableWaf:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Anexa um WAF (regras gerenciadas comuns e de entradas maliciosas, mais limite por IP).
      Tem custo mensal; exige a stack em us-east-1 (escopo CLOUDFRONT).
  EnableAccessLogs:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Grava logs de acesso do CloudFront num bucket proprio (expira em 30 dias).

Rules:
  WafNeedsUsEast1:
    RuleCondition: !Equals [!Ref EnableWaf, "true"]
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: WAF com escopo CLOUDFRONT so pode ser criado em us-east-1.

Conditions:
  HasApiHost: !Not [!Equals [!Ref ApiHost, ""]]
  HasReportsBucket: !Not [!Equals [!Ref ReportsBucket, ""]]
  UseWaf: !Equals [!Ref EnableWaf, "true"]
  UseLogs: !Equals [!Ref EnableAccessLogs, "true"]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "proofsec-web-${Stage}-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      Tags:
        - { Key: Component, Value: web }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "proofsec-web-${Stage}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "proofsec-web-${Stage}-security"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub
              - "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'${Reports} https://${RpcHost} wss://${RpcHost}${Api}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
              - Api: !If [HasApiHost, !Sub " https://${ApiHost}", ""]
                Reports: !If
                  - HasReportsBucket
                  - !Sub " https://${ReportsBucket}.s3.amazonaws.com https://${ReportsBucket}.s3.${AWS::Region}.amazonaws.com"
                  - ""
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
        CustomHeadersConfig:
          Items:
            - { Header: Permissions-Policy, Value: "camera=(), microphone=(), geolocation=()", Override: true }

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: UseWaf
    Properties:
      Name: !Sub "proofsec-web-${Stage}"
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: !Sub "proofsec-web-${Stage}" }
      Rules:
        - Name: common
          Priority: 1
          OverrideAction: { None: {} }
          Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesCommonRuleSet } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: common }
        - Name: known-bad-inputs
          Priority: 2
          OverrideAction: { None: {} }
          Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: known-bad-inputs }
        - Name: rate-limit-per-ip
          Priority: 3
          Action: { Block: {} }
          Statement: { RateBasedStatement: { Limit: 2000, AggregateKeyType: IP } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: rate-limit-per-ip }

  LogBucket:
    Type: AWS::S3::Bucket
    Condition: UseLogs
    Properties:
      BucketName: !Sub "proofsec-web-logs-${Stage}-${AWS::AccountId}-${AWS::Region}"
      # O log legado do CloudFront entrega por ACL: precisa de ObjectWriter (nao BucketOwnerEnforced).
      OwnershipControls:
        Rules: [{ ObjectOwnership: ObjectWriter }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: false
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - { Id: expire-logs, Status: Enabled, ExpirationInDays: 30 }
          - { Id: abort-incomplete-uploads, Status: Enabled, AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 } }
      Tags:
        - { Key: Component, Value: web }

  LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseLogs
    Properties:
      Bucket: !Ref LogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt LogBucket.Arn, !Sub "${LogBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        WebACLId: !If [UseWaf, !GetAtt WebAcl.Arn, !Ref "AWS::NoValue"]
        Logging: !If
          - UseLogs
          - { Bucket: !GetAtt LogBucket.DomainName, Prefix: web/, IncludeCookies: false }
          - !Ref "AWS::NoValue"
        Comment: !Sub "proofsec web ${Stage}"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        IPV6Enabled: true
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        # Pagina 100% client-side: rotas desconhecidas voltam para o index.
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 10 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 10 }
      Tags:
        - { Key: Component, Value: web }

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  SiteUrl:
    Description: Adicione este host em SiwsDomains e https://<host> em AllowedOrigin do backend.
    Value: !Sub "https://${Distribution.DomainName}"
