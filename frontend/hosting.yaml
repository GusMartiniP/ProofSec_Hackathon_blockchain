AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ProofSec - hospedagem do frontend estatico (Next export) em S3 privado + CloudFront (OAC).
  Replica os headers de seguranca de frontend/next.config.mjs (PS-12). Sem custodia, sem segredos.
  Fluxo: criar a stack -> NEXT_STATIC_EXPORT=1 npm run build -> aws s3 sync out/ s3://<Bucket>
  -> invalidar o CloudFront. Depois, adicionar o dominio da distribuicao em SiwsDomains e
  AllowedOrigin da stack do backend (proofsec-<Stage>).

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  ApiHost:
    Type: String
    Default: ""
    AllowedPattern: '^([a-z0-9.-]+)?$'
    Description: Host do API Gateway (sem https://), saida ApiEndpoint do backend. Vazio = modo so on-chain.
  RpcHost:
    Type: String
    Default: api.devnet.solana.com
    AllowedPattern: '^[a-z0-9.-]+$'
    Description: Host do RPC Solana (http e wss) liberado no connect-src.

Conditions:
  HasApiHost: !Not [!Equals [!Ref ApiHost, ""]]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "proofsec-web-${Stage}-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      Tags:
        - { Key: Component, Value: web }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "proofsec-web-${Stage}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "proofsec-web-${Stage}-security"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub
              - "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.amazonaws.com https://${RpcHost} wss://${RpcHost}${Api}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
              - Api: !If [HasApiHost, !Sub " https://${ApiHost}", ""]
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
        CustomHeadersConfig:
          Items:
            - { Header: Permissions-Policy, Value: "camera=(), microphone=(), geolocation=()", Override: true }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "proofsec web ${Stage}"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        IPV6Enabled: true
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        # Pagina 100% client-side: rotas desconhecidas voltam para o index.
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 10 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 10 }
      Tags:
        - { Key: Component, Value: web }

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  SiteUrl:
    Description: Adicione este host em SiwsDomains e https://<host> em AllowedOrigin do backend.
    Value: !Sub "https://${Distribution.DomainName}"
