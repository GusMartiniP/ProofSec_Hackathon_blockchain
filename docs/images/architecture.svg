<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 760" width="1140" height="760" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>ProofSec architecture</title>
  <desc>Browser, Solana program and a serverless AWS backend. Solana is the source of truth; AWS mirrors state, stores encrypted reports and runs the AI agent brain.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b57bff"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb347"/></marker>
  </defs>
  <rect width="1140" height="760" rx="16" fill="#0b1020"/>
  <text x="30" y="36" fill="#f8fafc" font-size="22" font-weight="700">ProofSec architecture</text>
  <text x="30" y="58" fill="#94a3b8" font-size="12.5">Solana holds the money and the rules. AWS is serverless, rebuildable from the chain, and never touches funds or plaintext reports.</text>

  <g transform="translate(0 40)">
  <!-- Browser -->
  <rect x="30" y="90" width="250" height="300" rx="12" fill="#111a33" stroke="#334155"/>
  <text x="48" y="118" fill="#e2e8f0" font-size="15" font-weight="700">Browser</text>
  <text x="48" y="136" fill="#94a3b8" font-size="12">Next.js 16 · AWS Amplify Hosting</text>
  <rect x="48" y="152" width="214" height="52" rx="8" fill="#1b2547"/>
  <text x="60" y="174" fill="#e2e8f0" font-size="13" font-weight="600">Phantom wallet</text>
  <text x="60" y="192" fill="#94a3b8" font-size="12">Wallet Standard · SIWS login</text>
  <rect x="48" y="214" width="214" height="62" rx="8" fill="#1b2547"/>
  <text x="60" y="236" fill="#e2e8f0" font-size="13" font-weight="600">Client-side crypto</text>
  <text x="60" y="254" fill="#94a3b8" font-size="12">X25519 + XSalsa20-Poly1305</text>
  <text x="60" y="270" fill="#94a3b8" font-size="12">report is encrypted here</text>
  <rect x="48" y="286" width="214" height="52" rx="8" fill="#1b2547"/>
  <text x="60" y="308" fill="#e2e8f0" font-size="13" font-weight="600">SHA-256 re-hash</text>
  <text x="60" y="326" fill="#94a3b8" font-size="12">compare with the on-chain hash</text>
  <text x="48" y="366" fill="#64748b" font-size="11.5">Company and researcher use the same app</text>
  <text x="48" y="381" fill="#64748b" font-size="11.5">in two different views.</text>

  <!-- Solana -->
  <rect x="340" y="90" width="270" height="300" rx="12" fill="#150f2e" stroke="#7c3aed"/>
  <text x="358" y="118" fill="#e9d5ff" font-size="15" font-weight="700">Solana devnet</text>
  <text x="358" y="136" fill="#b59ae0" font-size="12">Anchor program · source of truth</text>
  <rect x="358" y="152" width="234" height="40" rx="8" fill="#241a4d"/>
  <text x="370" y="170" fill="#f3e8ff" font-size="13" font-weight="600">JobAccount + Vault PDA</text>
  <text x="370" y="185" fill="#b59ae0" font-size="11.5">USDC escrow · scope hash · evidence hash</text>
  <rect x="358" y="200" width="234" height="40" rx="8" fill="#241a4d"/>
  <text x="370" y="218" fill="#f3e8ff" font-size="13" font-weight="600">Settlement rules</text>
  <text x="370" y="233" fill="#b59ae0" font-size="11.5">approve · claim · dispute · 50/50 timeout</text>
  <rect x="358" y="248" width="234" height="40" rx="8" fill="#241a4d"/>
  <text x="370" y="266" fill="#f3e8ff" font-size="13" font-weight="600">AgentPolicy</text>
  <text x="370" y="281" fill="#b59ae0" font-size="11.5">per-job and per-period spend caps</text>
  <rect x="358" y="296" width="234" height="40" rx="8" fill="#241a4d"/>
  <text x="370" y="314" fill="#f3e8ff" font-size="13" font-weight="600">Config</text>
  <text x="370" y="329" fill="#b59ae0" font-size="11.5">fee ≤ 10% · arbiter · treasury (frozen per job)</text>
  <text x="358" y="366" fill="#8b7bb8" font-size="11.5">Funds always have a public exit. No admin can</text>
  <text x="358" y="381" fill="#8b7bb8" font-size="11.5">move the vault.</text>

  <!-- Agent executor -->
  <rect x="340" y="430" width="270" height="118" rx="12" fill="#111a33" stroke="#334155"/>
  <text x="358" y="458" fill="#e2e8f0" font-size="15" font-weight="700">Agent executor</text>
  <text x="358" y="476" fill="#94a3b8" font-size="12">Lambda or CLI · non-custodial key</text>
  <text x="358" y="498" fill="#cbd5e1" font-size="12.5">Opens escrows for the company only inside</text>
  <text x="358" y="515" fill="#cbd5e1" font-size="12.5">the on-chain AgentPolicy limits.</text>
  <text x="358" y="535" fill="#64748b" font-size="11.5">The AI proposes; the chain enforces.</text>

  <g transform="translate(40 0)">
  <!-- AWS -->
  <rect x="660" y="90" width="410" height="600" rx="14" fill="#1a1308" stroke="#ff9900" stroke-dasharray="7 5"/>
  <text x="680" y="118" fill="#ffb347" font-size="15" font-weight="700">AWS · serverless (SAM, one stack)</text>
  <text x="680" y="136" fill="#c9a36a" font-size="12">Python 3.12 · arm64 · zero third-party dependencies</text>

  <rect x="680" y="152" width="370" height="58" rx="8" fill="#2a1d0a"/>
  <text x="694" y="174" fill="#fff1d6" font-size="13" font-weight="600">API Gateway HTTP API + Lambda authorizer</text>
  <text x="694" y="192" fill="#c9a36a" font-size="12">SIWS login → JWT · per-route throttling · access logs</text>

  <rect x="680" y="222" width="370" height="76" rx="8" fill="#2a1d0a"/>
  <text x="694" y="244" fill="#fff1d6" font-size="13" font-weight="600">20 Lambda functions</text>
  <text x="694" y="262" fill="#c9a36a" font-size="12">auth · jobs · evidence · users · agent brain</text>
  <text x="694" y="280" fill="#c9a36a" font-size="12">indexer (every minute) · S3 verify · alert fan-out</text>

  <rect x="680" y="310" width="180" height="76" rx="8" fill="#2a1d0a"/>
  <text x="694" y="332" fill="#fff1d6" font-size="13" font-weight="600">DynamoDB</text>
  <text x="694" y="350" fill="#c9a36a" font-size="12">Jobs · Users · Nonces (TTL)</text>
  <text x="694" y="367" fill="#c9a36a" font-size="12">mirror of the chain, PITR on</text>
  <rect x="870" y="310" width="180" height="76" rx="8" fill="#2a1d0a"/>
  <text x="884" y="332" fill="#fff1d6" font-size="13" font-weight="600">S3 reports bucket</text>
  <text x="884" y="350" fill="#c9a36a" font-size="12">encrypted blobs, presigned URLs</text>
  <text x="884" y="367" fill="#c9a36a" font-size="12">versioned · SSE · no public access</text>

  <rect x="680" y="398" width="180" height="62" rx="8" fill="#2a1d0a"/>
  <text x="694" y="420" fill="#fff1d6" font-size="13" font-weight="600">EventBridge</text>
  <text x="694" y="438" fill="#c9a36a" font-size="12">GuardDuty · Security Hub</text>
  <text x="694" y="452" fill="#c9a36a" font-size="12">scheduler for the indexer</text>
  <rect x="870" y="398" width="180" height="62" rx="8" fill="#2a1d0a"/>
  <text x="884" y="420" fill="#fff1d6" font-size="13" font-weight="600">SSM Parameter Store</text>
  <text x="884" y="438" fill="#c9a36a" font-size="12">SecureString secrets</text>
  <text x="884" y="452" fill="#c9a36a" font-size="12">nothing in env vars or git</text>

  <rect x="680" y="472" width="370" height="104" rx="8" fill="#2a1d0a"/>
  <text x="694" y="494" fill="#fff1d6" font-size="13" font-weight="600">Observability</text>
  <text x="694" y="513" fill="#c9a36a" font-size="12">Structured JSON logs · metric filters · 10 CloudWatch alarms</text>
  <text x="694" y="531" fill="#c9a36a" font-size="12">SNS alerts for failed logins, agent jobs, disputes, hash</text>
  <text x="694" y="547" fill="#c9a36a" font-size="12">mismatches and on-chain Config changes</text>
  <text x="694" y="565" fill="#c9a36a" font-size="12">DLQ · AWS Budgets · optional CloudTrail</text>

  <rect x="680" y="590" width="370" height="84" rx="8" fill="#2a1d0a"/>
  <text x="694" y="612" fill="#fff1d6" font-size="13" font-weight="600">Resilience</text>
  <text x="694" y="631" fill="#c9a36a" font-size="12">If AWS is down, every settlement still works straight on</text>
  <text x="694" y="647" fill="#c9a36a" font-size="12">Solana ("on-chain-only mode"). DynamoDB is rebuilt by the</text>
  <text x="694" y="663" fill="#c9a36a" font-size="12">indexer; the S3 object key is derived from the on-chain hash.</text>

  </g>

  <!-- Arrows -->
  <!-- browser -> API (REST + JWT) and S3 (presigned URLs) -->
  <path d="M155 90 C 155 50, 520 40, 700 172" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="380" y="54" fill="#94a3b8" font-size="11.5" text-anchor="middle">REST + JWT, then presigned URLs straight to S3</text>

  <!-- wallet <-> Solana -->
  <path d="M280 200 L340 200" stroke="#b57bff" stroke-width="2" fill="none" marker-end="url(#ap)" marker-start="url(#ap)"/>
  <text x="310" y="190" fill="#b57bff" font-size="11" text-anchor="middle">sign tx</text>

  <!-- indexer reads Solana -->
  <path d="M740 262 L612 262" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="676" y="252" fill="#94a3b8" font-size="11" text-anchor="middle">indexer reads</text>

  <!-- agent executor -> Solana -->
  <path d="M475 430 L475 392" stroke="#b57bff" stroke-width="2" fill="none" marker-end="url(#ap)"/>
  <text x="485" y="416" fill="#b57bff" font-size="11">initialize_job_by_agent</text>

  <!-- agent brain (Lambda) -> executor -->
  <path d="M740 285 C 690 300, 650 462, 612 478" stroke="#ffb347" stroke-width="1.8" fill="none" marker-end="url(#ao)"/>
  <text x="662" y="400" fill="#ffb347" font-size="11" text-anchor="middle">AI proposals</text>
  </g>
</svg>
