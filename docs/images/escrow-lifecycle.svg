<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>ProofSec escrow lifecycle</title>
  <desc>State machine of a ProofSec job: Open, InProgress, EvidenceSubmitted, then Completed or Disputed and Resolved; Cancelled and Refunded exits.</desc>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1100" height="520" rx="16" fill="#0b1020"/>
  <text x="30" y="40" fill="#f8fafc" font-size="22" font-weight="700">Escrow lifecycle</text>
  <text x="30" y="62" fill="#94a3b8" font-size="12.5">Every state has a public way out: funds can never be locked by a missing party. Each transition emits an on-chain event.</text>

  <!-- states -->
  <rect x="40" y="150" width="150" height="52" rx="10" fill="#1b2547" stroke="#60a5fa"/>
  <text x="115" y="173" fill="#dbeafe" font-size="14" font-weight="700" text-anchor="middle">Open</text>
  <text x="115" y="191" fill="#93c5fd" font-size="11.5" text-anchor="middle">USDC locked in vault</text>

  <rect x="270" y="150" width="150" height="52" rx="10" fill="#1b2547" stroke="#818cf8"/>
  <text x="345" y="173" fill="#e0e7ff" font-size="14" font-weight="700" text-anchor="middle">InProgress</text>
  <text x="345" y="191" fill="#a5b4fc" font-size="11.5" text-anchor="middle">researcher accepted</text>

  <rect x="500" y="150" width="190" height="52" rx="10" fill="#2a2210" stroke="#fbbf24"/>
  <text x="595" y="173" fill="#fef3c7" font-size="14" font-weight="700" text-anchor="middle">EvidenceSubmitted</text>
  <text x="595" y="191" fill="#fcd34d" font-size="11.5" text-anchor="middle">hash on-chain · review window</text>

  <rect x="800" y="86" width="190" height="52" rx="10" fill="#0f2a22" stroke="#14f195"/>
  <text x="895" y="109" fill="#d1fae5" font-size="14" font-weight="700" text-anchor="middle">Completed</text>
  <text x="895" y="127" fill="#6ee7b7" font-size="11.5" text-anchor="middle">researcher paid, fee to treasury</text>

  <rect x="800" y="222" width="190" height="52" rx="10" fill="#2d1414" stroke="#f87171"/>
  <text x="895" y="245" fill="#fee2e2" font-size="14" font-weight="700" text-anchor="middle">Disputed</text>
  <text x="895" y="263" fill="#fca5a5" font-size="11.5" text-anchor="middle">arbiter deadline running</text>

  <rect x="800" y="350" width="190" height="52" rx="10" fill="#0f2a2a" stroke="#2dd4bf"/>
  <text x="895" y="373" fill="#ccfbf1" font-size="14" font-weight="700" text-anchor="middle">Resolved</text>
  <text x="895" y="391" fill="#5eead4" font-size="11.5" text-anchor="middle">split paid out, vault closed</text>

  <rect x="40" y="350" width="150" height="52" rx="10" fill="#161d33" stroke="#64748b"/>
  <text x="115" y="373" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Cancelled</text>
  <text x="115" y="391" fill="#94a3b8" font-size="11.5" text-anchor="middle">refund before acceptance</text>

  <rect x="270" y="350" width="150" height="52" rx="10" fill="#161d33" stroke="#64748b"/>
  <text x="345" y="373" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Refunded</text>
  <text x="345" y="391" fill="#94a3b8" font-size="11.5" text-anchor="middle">refund to the client</text>

  <!-- transitions -->
  <path d="M190 176 L270 176" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="230" y="140" fill="#cbd5e1" font-size="11.5" text-anchor="middle">accept_job</text>
  <text x="230" y="155" fill="#64748b" font-size="10.5" text-anchor="middle">(assigned)</text>

  <path d="M420 176 L500 176" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="460" y="126" fill="#cbd5e1" font-size="11.5" text-anchor="middle">submit_evidence</text>
  <text x="460" y="141" fill="#64748b" font-size="10.5" text-anchor="middle">(hash H)</text>

  <path d="M690 164 C 740 164, 750 112, 800 112" stroke="#14f195" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="748" y="84" fill="#6ee7b7" font-size="11.5" text-anchor="middle">approve_and_release (client)</text>
  <text x="748" y="99" fill="#6ee7b7" font-size="11.5" text-anchor="middle">claim_after_review (silence)</text>

  <path d="M690 190 C 740 190, 750 248, 800 248" stroke="#f87171" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="742" y="228" fill="#fca5a5" font-size="11.5" text-anchor="middle" transform="translate(0 25)">open_dispute</text>
  <text x="742" y="243" fill="#64748b" font-size="10.5" text-anchor="middle" transform="translate(0 25)">client, inside the window</text>

  <path d="M895 274 L895 350" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="885" y="308" fill="#5eead4" font-size="11.5" text-anchor="end">resolve_dispute (arbiter, bps split)</text>
  <text x="885" y="323" fill="#5eead4" font-size="11.5" text-anchor="end">resolve_dispute_timeout (anyone, 50/50)</text>

  <path d="M115 202 L115 350" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="125" y="282" fill="#cbd5e1" font-size="11.5">cancel_job (client)</text>

  <path d="M345 202 L345 350" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="355" y="282" fill="#cbd5e1" font-size="11.5">refund_expired</text>
  <text x="355" y="297" fill="#64748b" font-size="10.5">deadline passed, no delivery</text>

  <path d="M595 202 L595 440 L345 440 L345 402" stroke="#64748b" stroke-width="1.8" fill="none" stroke-dasharray="6 5" marker-end="url(#g)"/>
  <text x="605" y="430" fill="#94a3b8" font-size="11.5">recover_stuck_funds (anyone, last resort)</text>
  <text x="605" y="446" fill="#64748b" font-size="10.5">30-day grace if a token account is frozen or nobody settles; goes to the client's account</text>

  <text x="30" y="492" fill="#64748b" font-size="11.5">Payouts only reach the token accounts registered in the job (researcher, treasury, client). The fee and the arbiter are frozen when the job is created.</text>
</svg>
