AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ProofSec - IAM users for AI coding agents (Claude Code, Codex, Antigravity).
  One user per agent, least privilege, no console access, no access keys in this template.
  PROPOSED - creating or changing IAM needs explicit human approval (AGENTS.md section 5).
  Deploy with a human admin identity, never with one of these users:
    aws cloudformation deploy --template-file docs/iam/agent-users.yaml \
      --stack-name proofsec-agent-iam --capabilities CAPABILITY_NAMED_IAM --no-execute-changeset

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev]   # agents never get access to another stage
    Description: Application stage the agents may inspect (stack proofsec-<Stage>).
  AppRegion:
    Type: String
    Default: us-east-1
    Description: Region of the proofsec-<Stage> stack (the selected Region).

Resources:
  # ---------------------------------------------------------------- guardrails
  # Attached to every agent. An explicit Deny always wins over any Allow.
  GuardrailsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: proofsec-agents-guardrails
      Description: Hard limits for all agents (AGENTS.md section 5 and 7).
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: NoIamOrOrgOrAccountChanges
            Effect: Deny
            Action:
              - iam:*
              - organizations:*
              - account:*
              - sts:AssumeRole
              - sso:*
              - sso-directory:*
            Resource: "*"
          - Sid: NoBillingChanges
            Effect: Deny
            Action:
              - aws-portal:Modify*
              - billing:Update*
              - billing:Put*
              - budgets:Modify*
              - budgets:Delete*
            Resource: "*"
          - Sid: NoExecutingChangesetsOrDeletingStacks
            Effect: Deny
            Action:
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteStack
              - cloudformation:UpdateStack
              - cloudformation:CreateStack
              - cloudformation:SetStackPolicy
              - cloudformation:CreateStackSet
              - cloudformation:UpdateTerminationProtection
            Resource: "*"
          - Sid: NoDeletingDataOrDisablingAudit
            Effect: Deny
            Action:
              - s3:DeleteBucket
              - s3:DeleteObject*
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:PutBucketPublicAccessBlock
              - s3:PutAccountPublicAccessBlock
              - dynamodb:DeleteTable
              - dynamodb:DeleteBackup
              - dynamodb:UpdateContinuousBackups
              - cloudtrail:StopLogging
              - cloudtrail:DeleteTrail
              - cloudtrail:UpdateTrail
              - cloudtrail:PutEventSelectors
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - guardduty:Delete*
              - guardduty:Disassociate*
              - guardduty:Stop*
              - securityhub:Disable*
              - config:Delete*
              - config:Stop*
              - kms:ScheduleKeyDeletion
              - kms:DisableKey
              - kms:Decrypt
              - kms:CreateGrant
            Resource: "*"
          - Sid: NoSecretValuesAndNoOtherStage
            # INV / section 7: agents never read runtime secrets; metadata only.
            Effect: Deny
            Action:
              - ssm:GetParameter*
              - ssm:PutParameter
              - ssm:DeleteParameter*
              - ssm:LabelParameterVersion
              - secretsmanager:GetSecretValue
              - secretsmanager:PutSecretValue
              - secretsmanager:DeleteSecret
            Resource: "*"
          - Sid: NoReadingReportObjects
            # INV-6: reports are encrypted client-side; agents have no reason to touch them.
            Effect: Deny
            Action:
              - s3:GetObject*
              - s3:PutObject*
            Resource: !Sub "arn:${AWS::Partition}:s3:::proofsec-reports-*"
          - Sid: NoSpendingServices
            # Hackathon budget: no GPU/compute fleets or model hosting via agent keys.
            Effect: Deny
            Action:
              - ec2:RunInstances
              - ec2:CreateNatGateway
              - ec2:AllocateAddress
              - sagemaker:Create*
              - bedrock:CreateProvisionedModelThroughput
              - rds:Create*
              - redshift:Create*
              - elasticache:Create*
              - eks:Create*
            Resource: "*"

  # ------------------------------------------------------------- read baseline
  # Everything that can be observed without touching data or secrets.
  ReadBaselinePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: proofsec-agents-read-baseline
      Description: Read-only view of the proofsec stack (metadata, logs, docs).
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Identity
            Effect: Allow
            Action: sts:GetCallerIdentity
            Resource: "*"
          - Sid: StackAndTemplateRead
            Effect: Allow
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResource*
              - cloudformation:ListStackResources
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
              - cloudformation:ListChangeSets
              - cloudformation:DescribeChangeSet
              - cloudformation:ListStacks
              - cloudformation:ValidateTemplate
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AppRegion
          - Sid: ResourceMetadataRead
            Effect: Allow
            Action:
              - lambda:GetFunction*
              - lambda:ListFunctions
              - lambda:GetPolicy
              - lambda:ListEventSourceMappings
              - apigateway:GET
              - dynamodb:DescribeTable
              - dynamodb:DescribeTimeToLive
              - dynamodb:DescribeContinuousBackups
              - dynamodb:ListTables
              - s3:ListAllMyBuckets
              - s3:GetBucketLocation
              - s3:GetBucketPolicy
              - s3:GetBucketPublicAccessBlock
              - s3:GetEncryptionConfiguration
              - s3:GetBucketVersioning
              - s3:GetLifecycleConfiguration
              - sns:ListTopics
              - sns:GetTopicAttributes
              - sqs:ListQueues
              - sqs:GetQueueAttributes
              - events:Describe*
              - events:ListRules
              - cloudwatch:DescribeAlarms
              - cloudwatch:GetMetricData
              - cloudwatch:ListMetrics
              - budgets:ViewBudget
              - ssm:DescribeParameters
              - ce:GetCostAndUsage
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: [!Ref AppRegion, us-east-1]
          - Sid: LogsRead
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
              - logs:FilterLogEvents
              - logs:GetLogEvents
              - logs:StartQuery
              - logs:GetQueryResults
              - logs:StopQuery
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AppRegion}:${AWS::AccountId}:log-group:/proofsec/${Stage}/*"
              - !Sub "arn:${AWS::Partition}:logs:${AppRegion}:${AWS::AccountId}:log-group:/proofsec/${Stage}/*:log-stream:*"
              - !Sub "arn:${AWS::Partition}:logs:${AppRegion}:${AWS::AccountId}:log-group:/aws/lambda/proofsec-${Stage}-*"
              - !Sub "arn:${AWS::Partition}:logs:${AppRegion}:${AWS::AccountId}:log-group:/aws/lambda/proofsec-${Stage}-*:log-stream:*"
          - Sid: LogGroupDiscovery
            Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: "*"
          - Sid: AwsKnowledge
            # AWS MCP server: documentation, skills, regional availability.
            Effect: Allow
            Action:
              - aws-mcp:InvokeMcp
              - aws-mcp:CallReadOnlyTool
            Resource: "*"

  # ------------------------------------------------------------- Claude Code
  # Owner of agent/ and frontend/: also needs to propose changesets for
  # agent/template.yaml and the SAM stack (review only, a human executes).
  ClaudeCodeDeployReviewPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: proofsec-claude-code-changeset-review
      Description: "sam deploy --no-execute-changeset on proofsec-<Stage> (plan only)."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CreateReviewChangeSetOnDevStackOnly
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:DeleteChangeSet
            Resource:
              - !Sub "arn:${AWS::Partition}:cloudformation:${AppRegion}:${AWS::AccountId}:stack/proofsec-${Stage}/*"
              - !Sub "arn:${AWS::Partition}:cloudformation:${AppRegion}:${AWS::AccountId}:stack/proofsec-${Stage}-*/*"
              - !Sub "arn:${AWS::Partition}:cloudformation:${AppRegion}:aws:transform/Serverless-2016-10-31"
          - Sid: SamArtifactBucket
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-*"
              - !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-*/*"
          - Sid: SamBucketBootstrapRead
            Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AppRegion}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*"

  ClaudeCodeUser:
    Type: AWS::IAM::User
    Properties:
      UserName: proofsec-agent-claude-code
      Path: /proofsec/agents/
      ManagedPolicyArns:
        - !Ref GuardrailsPolicy
        - !Ref ReadBaselinePolicy
        - !Ref ClaudeCodeDeployReviewPolicy
      Tags:
        - { Key: project, Value: proofsec }
        - { Key: agent, Value: claude-code }
        - { Key: owns, Value: "agent/ frontend/ tests/" }

  # ------------------------------------------------------------------- Codex
  # Owner of contracts/ (Solana, devnet). Needs no AWS write access at all;
  # read baseline lets it check how the backend decodes JobAccount from logs/stack.
  CodexUser:
    Type: AWS::IAM::User
    Properties:
      UserName: proofsec-agent-codex
      Path: /proofsec/agents/
      ManagedPolicyArns:
        - !Ref GuardrailsPolicy
        - !Ref ReadBaselinePolicy
      Tags:
        - { Key: project, Value: proofsec }
        - { Key: agent, Value: codex }
        - { Key: owns, Value: "contracts/" }

  # ------------------------------------------------------------- Antigravity
  # Orchestrator and independent security reviewer: broad READ across the account
  # via the AWS-managed SecurityAudit policy (config/metadata only, no data, no writes).
  AntigravityUser:
    Type: AWS::IAM::User
    Properties:
      UserName: proofsec-agent-antigravity
      Path: /proofsec/agents/
      ManagedPolicyArns:
        - !Ref GuardrailsPolicy
        - !Ref ReadBaselinePolicy
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/SecurityAudit"
      Tags:
        - { Key: project, Value: proofsec }
        - { Key: agent, Value: antigravity }
        - { Key: owns, Value: "docs/ (reviewer)" }

Outputs:
  ClaudeCodeUserName:
    Value: !Ref ClaudeCodeUser
  CodexUserName:
    Value: !Ref CodexUser
  AntigravityUserName:
    Value: !Ref AntigravityUser
  NextStep:
    Value: >-
      Create ONE access key per user out-of-band (human, aws iam create-access-key),
      store it in a named profile on the machine that runs that agent
      (never in git, never in prompts), rotate every 90 days.
